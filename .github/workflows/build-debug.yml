        static int quick_ack;
        uint64_t mustafa_mono_ns(void) {
            struct timespec t;
            clock_gettime(CLOCK_MONOTONIC, &t);
            return (uint64_t)t.tv_sec * 1000000000ULL + t.tv_nsec;
        }
        void mustafa_trace_reset(void) {
            pthread_mutex_lock(&trace_mutex);
            memset(trace_values, 0, sizeof(trace_values));
            trace_values[MT_RTT_US] = trace_values[MT_NTP_AGE_MS] = -1;
            trace_values[MT_HEADER_AGE_MS] = trace_values[MT_COMPLETE_AGE_MS] = -1;
            trace_values[MT_PROTOCOL] = -1;
