        start = src.index('@Composable\nfun SettingsScreen(')
        end = src.index('\n@Composable\nprivate fun MustafaSettingsIntro()', start)
        section = src[start:end]
        assert section.count('MustafaSettingsGroup(') == 5, 'Mustafa UI section count changed'
        assert section.count('MustafaSettingsIntro()') == 1
        assert section.count('MustafaAboutPanel()') == 1
        assert section.count('.verticalScroll(rememberScrollState())') == 1
        assert section.count('    Column(\n        modifier = Modifier') == 1
