            pthread_mutex_lock(&trace_mutex); trace_values[i] = v; pthread_mutex_unlock(&trace_mutex);
        }
        void mustafa_trace_max(int i, int64_t v) {
            if (i < 0 || i >= MT_COUNT) return;
            pthread_mutex_lock(&trace_mutex);
            if (v > trace_values[i]) trace_values[i] = v;
            pthread_mutex_unlock(&trace_mutex);
        }
        void mustafa_trace_increment(int i) {
