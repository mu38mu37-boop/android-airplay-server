        from pathlib import Path
        import re

        # Build 11: diagnosis ONLY. Preserve the complete Build 10 video behavior.
        ROOT = Path('app/src/main/kotlin/io/github/jqssun/airplay')

        def patch(path, before, after):
            p = ROOT / path
            src = p.read_text(encoding='utf-8')
            n = src.count(before)
            if n != 1:
                raise RuntimeError(f'Build11 diagnostic anchor failed in {p}: {n} matches for {before[:100]!r}')
            p.write_text(src.replace(before, after, 1), encoding='utf-8')

        def patch_regex(path, pat, replacement):
            p = ROOT / path
            s = p.read_text(encoding='utf-8')
            next_s, n = re.subn(pat, replacement, s, count=1, flags=re.MULTILINE)
            if n != 1:
                raise RuntimeError(f'Build11 diagnostic regex missing in {path}: {pat!r}')
            p.write_text(next_s, encoding='utf-8')

        renderer='renderer/VideoRenderer.kt'
        pipeline='renderer/VideoPipeline.kt'
        service='service/AirPlayService.kt'
        viewmodel='viewmodel/MainViewModel.kt'
        ui='ui/MainScreen.kt'

        # 1. One monotonic clock for internal stage durations. Source PTS is a separate
        # clock and may be invalid unless sender/receiver NTP mapping is sane.
        patch(renderer, '    private val pipeline = VideoPipeline()', '''    private val pipeline = VideoPipeline()
            // Diagnostic-only. The map is accessed exclusively by the existing renderer lock.
            private val queuedAtNs = LinkedHashMap<Long, Long>()
            @Volatile var rxPtsAgeMs = -1L; private set
            @Volatile var codecPtsAgeMs = -1L; private set
            @Volatile var glPtsAgeMs = -1L; private set
            @Volatile var decoderResidenceMs = -1L; private set
            @Volatile var glSubmitMs = -1L; private set
            @Volatile var outputFrameCount = 0L; private set
            @Volatile var glFrameCount = 0L; private set

