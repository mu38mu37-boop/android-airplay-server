    - name: Apply Build 7 performance tuning without touching stream quality
      run: |
        python3 - <<'PY'
        #!/usr/bin/env python3
        """Build #7 patch: speed up TV settings and rendering without changing video fidelity.
        
        Runs AFTER successful Build #5 and Build #6 patch steps, before Gradle compile.
        Changes no codec, media stream, max resolution, frame rate, or bitrate settings.
        """
        from pathlib import Path
        
        BASE = Path('app/src/main/kotlin/io/github/jqssun/airplay')
        
        
        def replace_one(path, old, new):
            p = Path(path)
            s = p.read_text(encoding='utf8')
            n = s.count(old)
            if n != 1:
                raise SystemExit(f'Build7 FAIL: {p}: expected exactly one occurrence, found {n}, of {old[:75]!r}')
            p.write_text(s.replace(old, new, 1), encoding='utf8')
        
        
        # 1. The old SettingsScreen eagerly composes all controls; change it into a
        #    segmented lazy list. Section cards are kept intact and remain remote-focusable.
        settings = BASE / 'ui/SettingsScreen.kt'
        src = settings.read_text(encoding='utf8')
        start = src.index('@Composable\nfun SettingsScreen(')
        end = src.index('\nprivate fun canAutoLaunch', start)
        section = src[start:end]
        assert section.count('MustafaSettingsGroup(') == 5, 'Mustafa UI section count changed'
        assert section.count('MustafaSettingsIntro()') == 1
        assert section.count('MustafaAboutPanel()') == 1
        assert section.count('.verticalScroll(rememberScrollState())') == 1
        assert section.count('    Column(\n        modifier = Modifier') == 1
        section = section.replace('    Column(\n        modifier = Modifier', '    LazyColumn(\n        modifier = Modifier', 1)
        section = section.replace('            .verticalScroll(rememberScrollState())\n', '', 1)
        section = section.replace(
            '        MustafaSettingsIntro()\n        MustafaSettingsGroup(',
            '        item(key = "intro") { MustafaSettingsIntro() }\n        item(key = "server") {\n            MustafaSettingsGroup(',
            1
        )
        assert section.count('item(key = "server")') == 1
        for name in ('connection', 'display', 'decode', 'developer'):
            needle = f'title = stringResource(R.string.section_{name})'
            assert section.count(needle) == 1, name
            ix = section.index(needle)
            group_ix = section.rfind('MustafaSettingsGroup(', 0, ix)
            assert group_ix >= 0, name
            section = section[:group_ix] + f'}}\n        item(key = "{name}") {{\n            ' + section[group_ix:]
        needle = 'MustafaAboutPanel()'
        assert section.count(needle) == 1
        section = section.replace(needle, '}\n        item(key = "about") { MustafaAboutPanel() }', 1)
        assert section.count('item(key = ') == 7
        assert section.count('MustafaSettingsGroup(') == 5
        src = src[:start] + section + src[end:]
        old_import = 'import androidx.compose.foundation.layout.*'
        assert src.count(old_import) == 1
        src = src.replace(old_import, old_import+'\nimport androidx.compose.foundation.lazy.LazyColumn',1)
        settings.write_text(src,encoding='utf8')
        
        
        # 2. Idle/mirroring refresh was always five times a second, even in settings.
        #    Media-player seeking remains at the previous 200 ms refresh rate.
        activity = BASE / 'MainActivity.kt'
        replace_one(activity,
        '''                    viewModel.updateFromService()
                            delay(200)''',
        '''                    viewModel.updateFromService()
                            // Don't force the entire TV UI to poll at 5 Hz while browsing menus.
                            // Keep the more responsive cadence for AirPlay video controls.
                            delay(if (viewModel.videoPlaybackActive.value) 200L else 500L)''')
        
        
        # 3. One full-GPU framebuffer clear per frame is redundant: the fullscreen GL
        #    quad covers 100% of the viewport. Keep exactly the same texture and shader.
        #    Give the rendering loop display-thread priority on the receiver itself.
        pipeline = BASE / 'renderer/VideoPipeline.kt'
        replace_one(pipeline,
        '''        thread = Thread({ _loop() }, "VideoPipeline").also { it.start() }''',
        '''        thread = Thread({
                    // Prioritize getting decoded frames onto the display without changing pixels.
                    android.os.Process.setThreadPriority(android.os.Process.THREAD_PRIORITY_DISPLAY)
                    _loop()
                }, "VideoPipeline").also { it.start() }''')
        replace_one(pipeline,
        '''        GLES20.glViewport(0, 0, winW, winH)
                GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT)
                GLES20.glUseProgram(program)''',
        '''        GLES20.glViewport(0, 0, winW, winH)
                // Fullscreen opaque quad paints every pixel; glClear adds costly extra fill.
                GLES20.glUseProgram(program)''')
        
        # 4. Guardrails: do not modify bitrate, decoder config, resolution, H.264, fps.
        assert 'LazyColumn(' in settings.read_text(encoding='utf8')
        assert 'android.os.Process.THREAD_PRIORITY_DISPLAY' in pipeline.read_text(encoding='utf8')
        assert 'GLES20.glClear(GLES20.GL_COLOR_BUFFER_BIT)' not in pipeline.read_text(encoding='utf8')
        print('PASS: lazy per-section TV settings, 500ms idle UI poll, display-priority GL, no redundant clear')
        print('PASS: preserve 2882x2160 option, frame rate, H.264 codec, bitrate, pixel fidelity, stretch and HUD')
