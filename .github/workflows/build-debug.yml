    - name: Build 10 - lossless native receiver offload and observable queues
      run: |
        python3 - <<'PY'
        #!/usr/bin/env python3
        """Major safe architectural change to Mustafa from Build9 stable.
        Move blocking MediaCodec work off native AirPlay RTP threads WITHOUT dropping any encoded H264 frame.
        """
        from pathlib import Path
        ROOT=Path('app/src/main/kotlin/io/github/jqssun/airplay')
        
        def replace_one(rel,old,new):
            p=ROOT/rel
            text=p.read_text('utf8')
            n=text.count(old)
            if n!=1: raise RuntimeError(f'Build10 patch failed {p}: anchor count {n} not 1: {old[:100]!r}')
            p.write_text(text.replace(old,new,1),'utf8')
        
        pump=ROOT/'renderer/VideoPacketPump.kt'
        if pump.exists(): raise RuntimeError('VideoPacketPump.kt already exists - expected clean base')
        pump.write_text('''package io.github.jqssun.airplay.renderer
        
        import android.os.Process
        import android.os.SystemClock
        import android.util.Log
        import java.util.concurrent.ArrayBlockingQueue
        import java.util.concurrent.TimeUnit
        
        /**
         * AirPlay RTP callback -> ordered, dedicated MediaCodec feeder.
         *
         * Crucial difference from the old Build8 dispatcher:
         * - NEVER discard an arbitrary H.264 P-frame, SPS, PPS or an entire GOP.
         * - Backpressure (rare) is applied only once all slots are in use.
         * - The output renderer's existing latest-DECODED-frame policy remains intact.
         * - There is exactly one MediaCodec feeder, so frame order stays correct.
         *
         * Not a claim of zero latency: when the hardware decoder is persistently slower
         * than the sender, preserving quality means backpressure cannot be eliminated.
         */
        class VideoPacketPump(private val renderer: VideoRenderer) {
            private data class Packet(
                val data: ByteArray,
                val ptsNs: Long,
                val h265: Boolean,
                val receivedNs: Long
            )
        
            // 6 encoded pictures ~= 200 ms at 30fps; keeps peak memory bounded.
            // No lossy overflow policy. This queue is intentionally smaller than Build8's.
            private val fifo = ArrayBlockingQueue<Packet>(6)
            @Volatile private var running = true
            private val statsLock = Any()
            @Volatile var queueWaitMs: Long = 0; private set
            @Volatile var receivedFps: Int = 0; private set
            @Volatile var backpressureCount: Long = 0; private set
            @Volatile var fedFps: Int = 0; private set
            val queueDepth: Int get() = fifo.size
            private var receivedInWindow = 0
            private var fedInWindow = 0
            private var lastTickMs = SystemClock.elapsedRealtime()
        
            private fun tick(now: Long) = synchronized(statsLock) {
                if (now - lastTickMs >= 1000) {
                    receivedFps = receivedInWindow
                    fedFps = fedInWindow
                    receivedInWindow = 0
                    fedInWindow = 0
                    lastTickMs = now
                    if (queueWaitMs > 80L || fifo.size >= 4 || backpressureCount > 0L) {
                        Log.i("MustafaLatency", "rx=$receivedFps fed=$fedFps " +
                            "queue=${fifo.size} queueWaitMs=$queueWaitMs " +
                            "backpressure=$backpressureCount outputDropped=${renderer.droppedFrames}")
                    }
                }
            }
        
            // Runs independently from the native RAOP packet receiver thread.
            private val feeder = Thread({
                Process.setThreadPriority(Process.THREAD_PRIORITY_DISPLAY)
                while (running) {
                    try {
                        val packet = fifo.poll(100, TimeUnit.MILLISECONDS) ?: continue
                        val wait = ((SystemClock.elapsedRealtimeNanos() - packet.receivedNs) / 1_000_000L)
                            .coerceAtLeast(0L)
                        queueWaitMs = (queueWaitMs * 3L + wait) / 4L
                        // MediaCodec may block. This thread, NOT the network callback, absorbs it.
                        renderer.feedFrame(packet.data, packet.ptsNs, packet.h265)
                        synchronized(statsLock) { fedInWindow++ }
                    } catch (_: InterruptedException) {
                        if (!running) return@Thread
                    } catch (e: Exception) {
                        Log.e("MustafaLatency", "Receiver worker recovered", e)
                    }
                }
            }, "MustafaVideoFeeder").also { it.isDaemon = true; it.start() }
        
            /** Preserve every encoded packet; backpressure only if the decoder can't catch up. */
            fun receive(data: ByteArray, ptsNs: Long, h265: Boolean) {
                if (!running) return
                val packet = Packet(data, ptsNs, h265, SystemClock.elapsedRealtimeNanos())
                synchronized(statsLock) { receivedInWindow++ }
                tick(SystemClock.elapsedRealtime())
                if (fifo.offer(packet)) return
                synchronized(statsLock) { backpressureCount++ }
                // Unlike Build8, never clear the GOP and never wait for a rare keyframe.
                while (running) {
                    try {
                        if (fifo.offer(packet, 40, TimeUnit.MILLISECONDS)) return
                    } catch (_: InterruptedException) {
                        Thread.currentThread().interrupt()
                        return
                    }
                }
            }
        
            /** Called only after the native RAOP server has stopped delivering packets. */
            fun close() {
                running = false
                fifo.clear()
                feeder.interrupt()
                if (Thread.currentThread() !== feeder) {
                    try { feeder.join(1500L) } catch (_: InterruptedException) {
                        Thread.currentThread().interrupt()
                    }
                }
                fifo.clear()
            }
        }
        ''','utf8')
        
        # Preserve the known-good decoder and GL code from Build9.
        # Only replace how native callback delivers encoded packets to that decoder.
        svc='service/AirPlayService.kt'
        replace_one(svc,
            'import io.github.jqssun.airplay.renderer.VideoRenderer',
            'import io.github.jqssun.airplay.renderer.VideoRenderer\nimport io.github.jqssun.airplay.renderer.VideoPacketPump')
        replace_one(svc,
            '    val videoRenderer = VideoRenderer(this)',
            '    val videoRenderer = VideoRenderer(this)\n    @Volatile private var videoPacketPump: VideoPacketPump? = null')
        # Start pump before accepting mirror packets. The service can restart within same instance.
        replace_one(svc,
            '        val maxFps = prefs[Prefs.MAX_FPS]',
            '''        // Core latency redesign: never run blocking MediaCodec operations on RAOP callback threads.
                videoPacketPump?.close()
                videoPacketPump = if (prefs[Prefs.FAST_PACKET_PUMP]) VideoPacketPump(videoRenderer) else null
                val maxFps = prefs[Prefs.MAX_FPS]''')
        replace_one(svc,
            '''    override fun onVideoData(data: ByteArray, ntpTimeNs: Long, isH265: Boolean) {
                videoRenderer.feedFrame(data, ntpTimeNs, isH265)
            }''',
            '''    override fun onVideoData(data: ByteArray, ntpTimeNs: Long, isH265: Boolean) {
                // All NAL units, including reference pictures, are kept in their original order.
                // The RAOP thread doesn't wait for a MediaCodec input buffer under normal load.
                val pump = videoPacketPump
                if (pump != null) pump.receive(data, ntpTimeNs, isH265)
                else videoRenderer.feedFrame(data, ntpTimeNs, isH265)
            }''')
        # Shutdown only once nativeStop() has returned and stopped callbacks.
        replace_one(svc,
            '''        videoRenderer.release()
                airPlayVideoPlayer.stop()''',
            '''        videoPacketPump?.close()
                videoPacketPump = null
                videoRenderer.release()
                airPlayVideoPlayer.stop()''')
        
        # Recovery switch makes the proven Build9 path accessible without reinstalling.
        replace_one('Prefs.kt',
            '    val LOW_LATENCY = bool("low_latency", false)',
            '    val LOW_LATENCY = bool("low_latency", false)\n    val FAST_PACKET_PUMP = bool("fast_packet_pump", true, restart = true)')
        
        replace_one('ui/SettingsScreen.kt',
            '    val lowLatency by viewModel.pref(Prefs.LOW_LATENCY).collectAsState()',
            '    val lowLatency by viewModel.pref(Prefs.LOW_LATENCY).collectAsState()\n    val fastPacketPump by viewModel.pref(Prefs.FAST_PACKET_PUMP).collectAsState()')
        replace_one('ui/SettingsScreen.kt',
            '''        if (developerOptions) {
                    SettingSwitch(
                        title = stringResource(R.string.setting_auto_start),''',
            '''        if (developerOptions) {
                    SettingSwitch(
                        title = "Fast AirPlay receiver (Build 10)",
                        description = "Dedicated lossless video feeder. Turn off to restore Build 9 receive path; restarts server.",
                        checked = fastPacketPump,
                        onCheckedChange = { viewModel.set(Prefs.FAST_PACKET_PUMP, it) }
                    )
                    SettingSwitch(
                        title = stringResource(R.string.setting_auto_start),''')
        
        # Display queue delay (not falsely claiming to measure sender-to-screen latency).
        replace_one('viewmodel/MainViewModel.kt',
            '''    val videoFps: Int = 0,
            val videoBitrate: Long = 0,''',
            '''    val videoFps: Int = 0,
            val receiverFps: Int = 0,
            val fedFps: Int = 0,
            val receiverQueueMs: Long = 0,
            val receiverQueueDepth: Int = 0,
            val receiverBackpressure: Long = 0,
            val videoBitrate: Long = 0,''')
        replace_one('service/AirPlayService.kt',
            '''        videoFps = videoRenderer.fps,
                videoBitrate = videoRenderer.bitrateBps,''',
            '''        videoFps = videoRenderer.fps,
                receiverFps = videoPacketPump?.receivedFps ?: 0,
                fedFps = videoPacketPump?.fedFps ?: 0,
                receiverQueueMs = videoPacketPump?.queueWaitMs ?: 0,
                receiverQueueDepth = videoPacketPump?.queueDepth ?: 0,
                receiverBackpressure = videoPacketPump?.backpressureCount ?: 0,
                videoBitrate = videoRenderer.bitrateBps,''')
        replace_one('ui/MainScreen.kt',
            '''                    HudMetric(Icons.Default.Memory, "Decoder", info.videoCodec.ifBlank { "Waiting" }, Color(0xFFEDE6FF))
                            HudMetric(Icons.Default.Timelapse, "Frame jitter", info.jitterStr, Color(0xFFE0F2FF))''',
            '''                    HudMetric(Icons.Default.Memory, "Decoder", info.videoCodec.ifBlank { "Waiting" }, Color(0xFFEDE6FF))
                            HudMetric(Icons.Default.NetworkCheck, "Receive / feed", "${info.receiverFps} / ${info.fedFps} FPS", Color(0xFFDEF5EF))
                            HudMetric(Icons.Default.Timelapse, "Receiver queue", "${info.receiverQueueMs} ms - ${info.receiverQueueDepth} waiting", Color(0xFFE0F2FF))
                            HudMetric(Icons.Default.Timelapse, "Frame jitter", info.jitterStr, Color(0xFFE0F2FF))''')
        
        # Runtime-safe MediaCodec input transfer: drain decoded output before blocking on next
        # input slot. Previously it could wait 20ms before ever draining output, in a loop.
        # This cannot damage stream references: it does not change compressed input data.
        renderer='renderer/VideoRenderer.kt'
        replace_one(renderer,
            '''        repeat(retries) {
                    val idx = c.dequeueInputBuffer(FEED_WAIT_US)''',
            '''        repeat(retries) {
                    // Do not let output buffers fill while waiting for input buffers.
                    // This feedback loop is a major latency source on some MediaTek decoders.
                    drainOutput()
                    val idx = c.dequeueInputBuffer(FEED_WAIT_US)''')
        
        # Keep all quality/transport/viewport settings exactly as in Build9.
        ss=(ROOT/svc).read_text('utf8')
        rr=(ROOT/renderer).read_text('utf8')
        assert 'VideoFrameDispatch' not in ss
        assert 'isSyncFrame' not in rr
        assert 'c.releaseOutputBuffer(latest, true)' in rr
        assert 'framePacketPump' not in ss
        assert 'val maxFps = prefs[Prefs.MAX_FPS]' in ss
        assert (ROOT/'ui/MainScreen.kt').read_text('utf8').count('applyAspectRatio = false')>=1
        print('PASS: native RAOP -> lossless ordered bounded feeder; no GOP loss or fake keyframe recovery')
        print('PASS: decoder output freed proactively before each input wait')
        print('PASS: original H264, pixels, bitrate, resolution, 30/60fps settings, Stretch and branded TV UI untouched')
