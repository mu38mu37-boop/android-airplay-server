        '''
        replace_once(main, needle, '\n' + header + needle)

        # Overview refresh: a branded, at-a-glance card; existing preview/actions remain functionally identical.
        replace_once(main, '''    Column(modifier = Modifier.fillMaxSize()) {
                // content area''', '''    Column(modifier = Modifier.fillMaxSize().padding(horizontal = 10.dp, vertical = 4.dp)) {
                MustafaWelcomeBanner(serverName = serverName, active = state == ServerState.RUNNING,
                    connections = connections)
                // content area''')
        replace_once(main,
            '''                .clip(RoundedCornerShape(16.dp))
                        .background(MaterialTheme.colorScheme.surfaceVariant),
