        #!/usr/bin/env python3
        """Build #9 stable TV settings only; no changes to previously working video path.
        
        Runs AFTER stable Build #6 patch steps, before Gradle compile.
        Changes no codec, media stream, max resolution, frame rate, or bitrate settings.
        """
        from pathlib import Path
        
        BASE = Path('app/src/main/kotlin/io/github/jqssun/airplay')
        
        
        def replace_one(path, old, new):
            p = Path(path)
            s = p.read_text(encoding='utf8')
            n = s.count(old)
            if n != 1:
