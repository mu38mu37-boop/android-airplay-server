        replace_one('service/AirPlayService.kt',
            '''        videoFps = videoRenderer.fps,
                videoBitrate = videoRenderer.bitrateBps,''',
            '''        videoFps = videoRenderer.fps,
                receiverFps = videoPacketPump?.receivedFps ?: 0,
