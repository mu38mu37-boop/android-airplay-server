            onPrimary = Color(0xFF082338),
            primaryContainer = Color(0xFF193956),
            onPrimaryContainer = Color(0xFFE1F3FF),
            secondary = Color(0xFFD3C3FF),
            onSecondary = Color(0xFF28164E),
            secondaryContainer = Color(0xFF30264A),
            onSecondaryContainer = Color(0xFFF1EAFF),
            tertiary = Color(0xFF94E5D4),
            onTertiary = Color(0xFF062C25),
            background = Color(0xFF0A1121),
            onBackground = Color(0xFFF4F7FF),
            surface = Color(0xFF151F33),
            onSurface = Color(0xFFF4F7FF),
            surfaceVariant = Color(0xFF202D46),
