        #!/usr/bin/env python3
        """Mustafa Build 8: an opt-in experimental decoder and direct display,
        production-safe bounded receiver dispatch, and measurable per-stage timings.

        Runs after the Build 5, 6 and 7 steps. Only affects mirroring, not movie playback.
        """
        from pathlib import Path
        ROOT=Path('app/src/main/kotlin/io/github/jqssun/airplay')


        def patch(path, old, new):
            p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
            if n!=1: raise RuntimeError(f'Build8 patch {p}: expected one anchor, found {n}: {old[:85]!r}')
            p.write_text(s.replace(old,new,1),encoding='utf-8')

        # A bounded receiver mailbox decouples native callback threads from slow MediaCodec calls.
        # We NEVER skip arbitrary compressed P frames and pretend the stream is still decodable.
        # On overload, we discard the compromised GOP and wait for an IDR/SPS before restarting.
        dispatch=ROOT/'renderer/VideoFrameDispatch.kt'
        assert not dispatch.exists(), 'Build8 file already exists: rebuild from base main branch'
        dispatch.write_text('''package io.github.jqssun.airplay.renderer

        import android.os.Process
        import android.os.SystemClock
        import android.util.Log
        import java.util.concurrent.ArrayBlockingQueue
        import java.util.concurrent.TimeUnit

        /** Receive data never waits for MediaCodec input dequeue. No destructive P-frame dropping. */
        class VideoFrameDispatch(private val renderer: VideoRenderer) {
            private data class Frame(
                val bytes: ByteArray, val ptsNs: Long, val h265: Boolean,
                val arrivedNs: Long, val restart: Boolean = false
            )
            private val gate = Any()
            private val frames = ArrayBlockingQueue<Frame>(6)
            @Volatile private var running = true
            @Volatile private var needKeyframe = false
            @Volatile var receivedFrames = 0L; private set
            @Volatile var receivedFps = 0; private set
            private var receiveCounter = 0
            private var lastReceiveTick = 0L
            @Volatile var discardedPackets = 0L; private set
            @Volatile var queueDelayMs = 0L; private set
            val queueSize: Int get() = frames.size
            private val worker = Thread({
                Process.setThreadPriority(Process.THREAD_PRIORITY_DISPLAY)
                while (running) {
                    try {
                        val f = frames.poll(250L, TimeUnit.MILLISECONDS) ?: continue
                        if (f.restart) renderer.resetAfterGopGap()
                        val delay = (SystemClock.elapsedRealtimeNanos() - f.arrivedNs).coerceAtLeast(0L) / 1_000_000L
                        queueDelayMs = if (queueDelayMs == 0L) delay else (queueDelayMs * 3L + delay) / 4L
                        renderer.feedFrame(f.bytes, f.ptsNs, f.h265)
                    } catch (_: InterruptedException) {
                        if (!running) break
                    } catch (t: Exception) {
                        Log.w("MustafaReceiver", "Video decode worker recovered from error", t)
                    }
                }
            }, "MustafaVideoReceive").also { it.isDaemon = true; it.start() }

            fun submit(data: ByteArray, ptsNs: Long, h265: Boolean) {
                if (!running) return
                synchronized(gate) {
                    receivedFrames++
                    val now = SystemClock.elapsedRealtime()
                    if (now - lastReceiveTick >= 1000L) {
                        receivedFps = receiveCounter
                        receiveCounter = 0
                        lastReceiveTick = now
                    }
                    receiveCounter++
                    if (needKeyframe) {
                        if (!renderer.isSyncFrame(data, h265)) { discardedPackets++; return }
                        needKeyframe = false
                        frames.clear()
                        frames.offer(Frame(data, ptsNs, h265, SystemClock.elapsedRealtimeNanos(), restart = true))
                        return
                    }
                    if (!frames.offer(Frame(data, ptsNs, h265, SystemClock.elapsedRealtimeNanos()))) {
                        // All pictures in this GOP depend on one another. Recover at next sync frame.
                        discardedPackets += frames.size.toLong() + 1L
                        frames.clear()
                        needKeyframe = true
                        if (renderer.isSyncFrame(data, h265)) {
                            needKeyframe = false
                            frames.offer(Frame(data, ptsNs, h265, SystemClock.elapsedRealtimeNanos(), restart = true))
                        }
                    }
                }
            }
            fun resetSession() = synchronized(gate) {
                frames.clear(); needKeyframe = true; queueDelayMs = 0
                receivedFrames = 0; receivedFps = 0; receiveCounter = 0
                discardedPackets = 0
            }
            fun close() {
                running = false
                worker.interrupt()
                if (Thread.currentThread() !== worker) worker.join(1500)
                frames.clear()
            }
        }
        ''', encoding='utf-8')

