name: Mustafa TV - Build 10 Lossless Receiver Pipeline
on:
  push:
    branches:
    - main
    paths:
    - .github/workflows/build-debug.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Android source and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '21'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
    - name: Install Android platform and native build tools
      run: |
        sdkmanager 'platforms;android-37.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
    - name: Apply Stretch, v4 low latency, solid dashboard and remote shortcut
      run: |
        python3 - <<'PY'
        from pathlib import Path

        ui = Path('app/src/main/kotlin/io/github/jqssun/airplay/ui/MainScreen.kt')
        source = ui.read_text(encoding='utf-8')
        before = '''    val video: @Composable () -> Unit = {
                val aspect by viewModel.videoAspect.collectAsState()
                VideoSurfaceView(
                    onSurfaceAvailable = onSurfaceAvailable,
                    onSurfaceDestroyed = onSurfaceDestroyed,
                    aspectRatio = aspect
                )
            }'''
        after = '''    val video: @Composable () -> Unit = {
                VideoSurfaceView(
                    onSurfaceAvailable = onSurfaceAvailable,
                    onSurfaceDestroyed = onSurfaceDestroyed,
                    applyAspectRatio = false,
                    modifier = Modifier.fillMaxSize()
                )
            }'''
        if source.count(before) != 1:
            raise SystemExit('FAIL: mirroring layout changed; cannot apply safe Stretch patch')
        ui.write_text(source.replace(before, after, 1), encoding='utf-8')

        # Avoid presenting obsolete frames when decoder output has queued up.
        # The compressed stream stays intact; only decoded DISPLAY frames can be skipped.
        decoder = Path('app/src/main/kotlin/io/github/jqssun/airplay/renderer/VideoRenderer.kt')
        renderer = decoder.read_text(encoding='utf-8')
        old_drain = '''    private fun drainOutput() {
                val c = codec ?: return
                val info = MediaCodec.BufferInfo()
                while (true) {
                    val idx = c.dequeueOutputBuffer(info, 0)
                    if (idx < 0) break
                    _recordOutputFrameTime()
                    if (scheduledOutputBufferRelease) {
                        // schedule frame at VSYNC matching its NTP presentation time
                        val ptsUs = info.presentationTimeUs
                        if (_ptsBaseUs == Long.MIN_VALUE) {
                            _ptsBaseUs = ptsUs
                            _wallBaseNs = System.nanoTime()
                        }
                        c.releaseOutputBuffer(idx, _wallBaseNs + (ptsUs - _ptsBaseUs) * 1000L)
                    } else {
                        c.releaseOutputBuffer(idx, true)
                    }
                }
            }'''
        new_drain = '''    private fun drainOutput() {
                val c = codec ?: return
                val info = MediaCodec.BufferInfo()
                var latest = -1
                var latestPtsUs = 0L
                while (true) {
                    val idx = c.dequeueOutputBuffer(info, 0)
                    if (idx < 0) break
                    // All packets were decoded. Discard stale DISPLAY buffers only:
                    // this avoids damaging the inter-frame reference chain.
                    if (latest >= 0) {
                        c.releaseOutputBuffer(latest, false)
                        droppedFrames++
                    }
                    latest = idx
                    latestPtsUs = info.presentationTimeUs
                }
                if (latest < 0) return
                _recordOutputFrameTime()
                if (scheduledOutputBufferRelease) {
                    if (_ptsBaseUs == Long.MIN_VALUE) {
                        _ptsBaseUs = latestPtsUs
                        _wallBaseNs = System.nanoTime()
                    }
                    c.releaseOutputBuffer(latest, _wallBaseNs + (latestPtsUs - _ptsBaseUs) * 1000L)
                } else {
                    // Low-latency mode: render the latest decoded frame immediately.
                    c.releaseOutputBuffer(latest, true)
                }
            }'''
        if renderer.count(old_drain) != 1:
            raise SystemExit('FAIL: VideoRenderer drainOutput differs; refusing risky patch')
        decoder.write_text(renderer.replace(old_drain, new_drain, 1), encoding='utf-8')
        result = decoder.read_text(encoding='utf-8')
        assert result.count('c.releaseOutputBuffer(latest, false)') == 1
        assert result.count('c.releaseOutputBuffer(latest, true)') == 1
        print('PASS: low-latency video now keeps latest decoded frame when backlog accumulates')

        verified_ui = ui.read_text(encoding='utf-8')
        assert verified_ui.count('applyAspectRatio = false,\n            modifier = Modifier.fillMaxSize()') == 1
        print('PASS: Stretch mirror preview uses whole TV surface, no aspect-ratio restriction')


        from pathlib import Path


        def patch_once(path: str, old: str, new: str) -> None:
            p = Path(path)
            text = p.read_text(encoding='utf-8')
            count = text.count(old)
            if count != 1:
                raise SystemExit(f'FAIL: {path}: patch anchor found {count} times, expected 1')
            p.write_text(text.replace(old, new, 1), encoding='utf-8')

        ui_path = 'app/src/main/kotlin/io/github/jqssun/airplay/ui/MainScreen.kt'
        ui = Path(ui_path)
        source = ui.read_text(encoding='utf-8')
        start = '@Composable\nprivate fun DebugOverlay(info: DebugInfo, modifier: Modifier = Modifier) {'
        end = '\nprivate data class DebugSection('
        if source.count(start) != 1 or source.count(end) != 1:
            raise SystemExit('FAIL: dashboard anchor changed')
        head, tail = source.split(start, 1)
        _, rest = tail.split(end, 1)
        # This file will be inserted inside the workflow by the packaging generator.
        HUD = '''@Composable
        private fun DebugOverlay(info: DebugInfo, modifier: Modifier = Modifier) {
            val context = LocalContext.current
            val cm = remember(context) {
                context.getSystemService(Context.CONNECTIVITY_SERVICE) as? android.net.ConnectivityManager
            }
            val caps = cm?.let { manager ->
                manager.activeNetwork?.let { network -> manager.getNetworkCapabilities(network) }
            }
            val isWifi = caps?.hasTransport(android.net.NetworkCapabilities.TRANSPORT_WIFI) == true
            val isEthernet = caps?.hasTransport(android.net.NetworkCapabilities.TRANSPORT_ETHERNET) == true
            val networkType = when {
                isEthernet -> "Ethernet"
                isWifi -> "Wi-Fi"
                else -> "Unavailable"
            }
            val wifiRssi = if (isWifi) runCatching {
                val wifi = context.applicationContext.getSystemService(Context.WIFI_SERVICE)
                    as? android.net.wifi.WifiManager
                wifi?.connectionInfo?.rssi
            }.getOrNull() else null
            val signal = when {
                isEthernet -> "Wired connection"
                wifiRssi != null && wifiRssi in -100..-1 -> "$wifiRssi dBm"
                else -> "Not available"
            }

            androidx.compose.material3.Surface(
                modifier = modifier.width(326.dp),
                shape = RoundedCornerShape(20.dp),
                color = Color(0xFFFAFBFF),
                shadowElevation = 10.dp
            ) {
                Column(
                    modifier = Modifier.padding(14.dp),
                    verticalArrangement = Arrangement.spacedBy(8.dp)
                ) {
                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        verticalAlignment = Alignment.CenterVertically,
                        horizontalArrangement = Arrangement.SpaceBetween
                    ) {
                        Row(verticalAlignment = Alignment.CenterVertically) {
                            Box(Modifier.size(9.dp).background(Color(0xFF23A88D), CircleShape))
                            Spacer(Modifier.width(8.dp))
                            Text(if (info.connections > 0) "AIRPLAY  •  LIVE" else "AIRPLAY  •  IDLE", color = Color(0xFF1B315C),
                                style = MaterialTheme.typography.titleSmall.copy(fontWeight = FontWeight.Bold))
                        }
                        Text("STRETCH", color = Color(0xFF4267AC),
                            style = MaterialTheme.typography.labelSmall.copy(fontWeight = FontWeight.Bold))
                    }
                    HorizontalDivider(color = Color(0xFFE3EAF5))
                    HudMetric(Icons.Default.Wifi, "TV network", networkType, Color(0xFFE0F2FF))
                    HudMetric(Icons.Default.NetworkCheck, "TV signal", signal, Color(0xFFDEF5EF))
                    HudMetric(Icons.Default.Image, "Resolution", info.videoRes.ifBlank { "Waiting" }, Color(0xFFEDE6FF))
                    HudMetric(Icons.Default.Movie, "Frame rate", if (info.videoCodec.isBlank()) "Waiting" else "${info.videoFps} FPS", Color(0xFFE0F2FF))
                    HudMetric(Icons.Default.Speed, "Stream bitrate", info.bitrateStr, Color(0xFFE2F7EF))
                    HudMetric(Icons.Default.Memory, "Decoder", info.videoCodec.ifBlank { "Waiting" }, Color(0xFFEDE6FF))
                    HudMetric(Icons.Default.Timelapse, "Frame jitter", info.jitterStr, Color(0xFFE0F2FF))
                    HudMetric(Icons.Default.BrokenImage, "Dropped frames", "${info.droppedFrames}", Color(0xFFFFE8ED))
                    HudMetric(Icons.Default.Link, "Connections", "${info.connections}", Color(0xFFE2F7EF))
                    HorizontalDivider(color = Color(0xFFE3EAF5))
                    Text("Hold OK or press MENU / INFO to hide", color = Color(0xFF64748B),
                        style = MaterialTheme.typography.labelSmall)
                }
            }
        }

        @Composable
        private fun HudMetric(
            icon: ImageVector,
            label: String,
            value: String,
            iconBackground: Color
        ) {
            Row(
                modifier = Modifier.fillMaxWidth(),
                verticalAlignment = Alignment.CenterVertically,
                horizontalArrangement = Arrangement.spacedBy(9.dp)
            ) {
                Box(
                    modifier = Modifier.size(32.dp).clip(RoundedCornerShape(9.dp)).background(iconBackground),
                    contentAlignment = Alignment.Center
                ) {
                    Icon(icon, contentDescription = null, tint = Color(0xFF2E568A), modifier = Modifier.size(20.dp))
                }
                Text(
                    label,
                    color = Color(0xFF56647B),
                    style = MaterialTheme.typography.labelMedium,
                    modifier = Modifier.weight(1f)
                )
                Text(
                    value,
                    color = Color(0xFF172746),
                    style = MaterialTheme.typography.labelMedium.copy(fontWeight = FontWeight.SemiBold),
                    maxLines = 1,
                    overflow = TextOverflow.Ellipsis,
                    modifier = Modifier.widthIn(max = 165.dp)
                )
            }
        }'''
        ui.write_text(head + HUD + end + rest, encoding='utf-8')

        # Avoid overlapping with the fullscreen control buttons while the HUD is visible.
        patch_once(ui_path,
            'visible = controlsVisible,\n            modifier = Modifier.align(Alignment.TopEnd)',
            'visible = controlsVisible,\n            modifier = Modifier.align(if (debugEnabled) Alignment.BottomEnd else Alignment.TopEnd)')

        # Keep the good v4 decoder path and avoid unnecessary debug recomposition (5 Hz -> 1 Hz).
        vm_path = 'app/src/main/kotlin/io/github/jqssun/airplay/viewmodel/MainViewModel.kt'
        patch_once(vm_path,
            '    private val prefs = app.getSharedPreferences(Prefs.NAME, Context.MODE_PRIVATE)',
            '    private var lastHudSampleMs = 0L\n    private val prefs = app.getSharedPreferences(Prefs.NAME, Context.MODE_PRIVATE)')
        patch_once(vm_path,
            '            if (pref(Prefs.DEBUG_ENABLED).value) {\n                _debugInfo.value = it.collectDebugInfo()\n            }',
            '            if (pref(Prefs.DEBUG_ENABLED).value) {\n                val now = SystemClock.elapsedRealtime()\n                if (now - lastHudSampleMs >= 1000L) {\n                    lastHudSampleMs = now\n                    _debugInfo.value = it.collectDebugInfo()\n                }\n            }')

        activity = 'app/src/main/kotlin/io/github/jqssun/airplay/MainActivity.kt'
        patch_once(activity,
            'import android.view.WindowManager',
            'import android.view.KeyEvent\nimport android.view.WindowManager')
        patch_once(activity,
            '    private val viewModel: MainViewModel by viewModels()',
            '''    private val viewModel: MainViewModel by viewModels()
            private var hudLongPressHandled = false

            // Remote shortcut works while mirroring without depending on Compose focus.
            // Some remotes lack MENU/INFO, so repeated OK/ENTER is also supported.
            override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                val isCenter = event.keyCode == KeyEvent.KEYCODE_DPAD_CENTER ||
                    event.keyCode == KeyEvent.KEYCODE_ENTER
                val isMenu = event.keyCode == KeyEvent.KEYCODE_MENU ||
                    event.keyCode == KeyEvent.KEYCODE_INFO
                if (isCenter && event.action == KeyEvent.ACTION_UP && hudLongPressHandled) {
                    hudLongPressHandled = false
                    return true
                }
                if (!viewModel.mirroringActive.value || isInPip.value) {
                    if (event.action == KeyEvent.ACTION_UP) hudLongPressHandled = false
                    return super.dispatchKeyEvent(event)
                }
                if (isMenu) {
                    if (event.action == KeyEvent.ACTION_DOWN && event.repeatCount == 0) {
                        viewModel.set(Prefs.DEBUG_ENABLED, !viewModel.pref(Prefs.DEBUG_ENABLED).value)
                    }
                    return true
                }
                if (isCenter && event.action == KeyEvent.ACTION_DOWN) {
                    if (!hudLongPressHandled && (event.isLongPress || event.repeatCount > 0)) {
                        hudLongPressHandled = true
                        viewModel.set(Prefs.DEBUG_ENABLED, !viewModel.pref(Prefs.DEBUG_ENABLED).value)
                        return true
                    }
                    if (hudLongPressHandled) return true
                }
                return super.dispatchKeyEvent(event)
            }''')

        settings = 'app/src/main/kotlin/io/github/jqssun/airplay/ui/SettingsScreen.kt'
        patch_once(settings,
            '        SectionHeader(stringResource(R.string.section_display))',
            '''        SectionHeader(stringResource(R.string.section_display))

                SettingSwitch(
                    title = "Performance dashboard",
                    description = "Solid icon dashboard while mirroring. Hold OK, or use MENU/INFO, to show or hide.",
                    checked = debugEnabled,
                    onCheckedChange = { viewModel.set(Prefs.DEBUG_ENABLED, it) }
                )''')

        # The original open-source project defaults debug_enabled=false. Keep HUD hidden on fresh installs.
        prefs = Path('app/src/main/kotlin/io/github/jqssun/airplay/Prefs.kt').read_text(encoding='utf-8')
        assert prefs.count('val DEBUG_ENABLED = bool("debug_enabled", false)') == 1
        assert Path(ui_path).read_text(encoding='utf-8').count('private fun HudMetric(') == 1
        print('PASS: solid icon HUD, real stream telemetry, remote toggle, 1-second refresh, Stretch v4 retained')

        PY
        git diff --check
        git diff --stat
    - name: Apply Mustafa branding and TV UI refresh (no streaming changes)
      run: |
        python3 - <<'PY'
        #!/usr/bin/env python3
        """Build #6: Mustafa UI-only refresh layered on known-good Build #5.
        Intentionally does not modify AirPlay, rendering or decoder implementation.
        """
        from pathlib import Path

        BASE = Path('app/src/main')
        UI = BASE / 'kotlin/io/github/jqssun/airplay/ui'


        def replace_once(path, old, new):
            p = Path(path)
            t = p.read_text(encoding='utf-8')
            if t.count(old) != 1:
                raise SystemExit('FAIL: {}: anchor occurred {} times (expected 1): {}'.format(path, t.count(old), repr(old[:110])))
            p.write_text(t.replace(old, new, 1), encoding='utf-8')


        # Preserve applicationId (so settings and device pairing remain intact), just rebrand launcher identity.
        strings = BASE / 'res/values/strings.xml'
        replace_once(strings, '<string name="app_name">AirPlay Server</string>', '<string name="app_name">Mustafa</string>')
        replace_once(strings, '<string name="notification_title">AirPlay Server Running</string>', '<string name="notification_title">Mustafa is running</string>')

        # Stable TV-focused colors, not dynamic wallpaper-dependent colors.
        theme = UI / 'theme/Theme.kt'
        theme_text = '''package io.github.jqssun.airplay.ui.theme

        import androidx.compose.material3.MaterialTheme
        import androidx.compose.material3.darkColorScheme
        import androidx.compose.runtime.Composable
        import androidx.compose.ui.graphics.Color

        private val MustafaColors = darkColorScheme(
            primary = Color(0xFF9DDAFF),
            onPrimary = Color(0xFF082338),
            primaryContainer = Color(0xFF193956),
            onPrimaryContainer = Color(0xFFE1F3FF),
            secondary = Color(0xFFD3C3FF),
            onSecondary = Color(0xFF28164E),
            secondaryContainer = Color(0xFF30264A),
            onSecondaryContainer = Color(0xFFF1EAFF),
            tertiary = Color(0xFF94E5D4),
            onTertiary = Color(0xFF062C25),
            background = Color(0xFF0A1121),
            onBackground = Color(0xFFF4F7FF),
            surface = Color(0xFF151F33),
            onSurface = Color(0xFFF4F7FF),
            surfaceVariant = Color(0xFF202D46),
            onSurfaceVariant = Color(0xFFB9C8DF),
            outline = Color(0xFF536781),
            outlineVariant = Color(0xFF34445F),
            error = Color(0xFFFFB4AB),
            onError = Color(0xFF690005)
        )

        @Composable
        fun AirPlayTheme(content: @Composable () -> Unit) {
            MaterialTheme(colorScheme = MustafaColors, content = content)
        }
        '''
        assert 'fun AirPlayTheme(' in theme.read_text(encoding='utf-8')
        theme.write_text(theme_text, encoding='utf-8')

        # Add vector-brand application icon, pure drawable code (no external fonts or graphics).
        logo = BASE / 'res/drawable/mustafa_logo.xml'
        logo.write_text('''<?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path android:fillColor="#0B1530"
                android:pathData="M23,6 L85,6 Q102,6 102,23 L102,85 Q102,102 85,102 L23,102 Q6,102 6,85 L6,23 Q6,6 23,6 Z"/>
            <path android:fillColor="#9DDAFF"
                android:pathData="M25,79 L25,29 L37,29 L54,50 L71,29 L83,29 L83,79 L69,79 L69,51 L54,69 L39,51 L39,79 Z"/>
            <path android:fillColor="#95E5D3"
                android:pathData="M30,87 L78,87 L78,91 L30,91 Z"/>
        </vector>
        ''', encoding='utf-8')
        manifest = BASE / 'AndroidManifest.xml'
        replace_once(manifest, 'android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/mustafa_logo"')
        replace_once(manifest, 'android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/mustafa_logo"')

        # Android TV uses a wide launcher banner in addition to its square app icon.
        banner = BASE / 'res/drawable/mustafa_banner.xml'
        banner.write_text('''<?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="320dp" android:height="180dp"
            android:viewportWidth="320" android:viewportHeight="180">
            <path android:fillColor="#0B1530" android:pathData="M0,0 L320,0 L320,180 L0,180 Z" />
            <path android:fillColor="#1C304C" android:pathData="M180,0 L320,0 L320,180 L114,180 Z" />
            <path android:fillColor="#9DDAFF" android:pathData="M50,125 L50,55 L67,55 L92,85 L117,55 L134,55 L134,125 L115,125 L115,85 L92,111 L69,85 L69,125 Z" />
            <path android:fillColor="#94E5D4" android:pathData="M50,136 L134,136 L134,142 L50,142 Z" />
            <path android:fillColor="#D3C3FF" android:pathData="M193,58 L275,58 L275,64 L193,64 Z" />
            <path android:fillColor="#9DDAFF" android:pathData="M193,82 L286,82 L286,88 L193,88 Z" />
            <path android:fillColor="#94E5D4" android:pathData="M193,106 L259,106 L259,112 L193,112 Z" />
        </vector>
        ''', encoding='utf-8')
        replace_once(manifest, 'android:banner="@drawable/banner"', 'android:banner="@drawable/mustafa_banner"')

        # Keep the user's full-screen display, AirPlay receiving, v4 low-latency, and v5 HUD untouched.
        main = UI / 'MainScreen.kt'
        replace_once(main, 'import androidx.compose.ui.graphics.Brush', 'import androidx.compose.ui.graphics.Brush\nimport androidx.compose.foundation.BorderStroke')
        replace_once(main, '''        Scaffold(
                    bottomBar = {''', '''        Scaffold(
                    containerColor = MaterialTheme.colorScheme.background,
                    topBar = { MustafaTopBar(connections) },
                    bottomBar = {''')
        replace_once(main, '                    NavigationBar {', '                    NavigationBar(containerColor = MaterialTheme.colorScheme.surface) {')
        replace_once(main,
            '            Box(modifier = Modifier.padding(padding).consumeWindowInsets(padding)) {',
            '            Box(modifier = Modifier.fillMaxSize().padding(padding).consumeWindowInsets(padding)) {')

        # Insert a real TV header after MainScreen, no changes to fullscreen and PIN flow.
        needle = '\n@Composable\nprivate fun TabContent('
        header = '''
        @Composable
        private fun MustafaTopBar(connections: Int) {
            Surface(
                color = MaterialTheme.colorScheme.surface,
                shadowElevation = 5.dp
            ) {
                Row(
                    modifier = Modifier.fillMaxWidth().padding(horizontal = 26.dp, vertical = 11.dp),
                    verticalAlignment = Alignment.CenterVertically,
                    horizontalArrangement = Arrangement.spacedBy(13.dp)
                ) {
                    Box(
                        modifier = Modifier.size(46.dp).clip(RoundedCornerShape(15.dp))
                            .background(Brush.linearGradient(listOf(Color(0xFF8ECFFF), Color(0xFFD2B8FF)))),
                        contentAlignment = Alignment.Center
                    ) {
                        Text("M", color = Color(0xFF0D1832),
                            style = MaterialTheme.typography.headlineMedium.copy(fontWeight = FontWeight.Black))
                    }
                    Column {
                        Text("Mustafa", style = MaterialTheme.typography.titleLarge.copy(fontWeight = FontWeight.Bold))
                        Text("AIRPLAY RECEIVER  •  GOOGLE TV", color = MaterialTheme.colorScheme.onSurfaceVariant,
                            style = MaterialTheme.typography.labelSmall)
                    }
                    Spacer(Modifier.weight(1f))
                    Surface(
                        color = if (connections > 0) Color(0xFF163E39) else Color(0xFF22314E),
                        shape = RoundedCornerShape(50.dp)
                    ) {
                        Row(
                            modifier = Modifier.padding(horizontal = 15.dp, vertical = 9.dp),
                            verticalAlignment = Alignment.CenterVertically,
                            horizontalArrangement = Arrangement.spacedBy(8.dp)
                        ) {
                            Icon(
                                if (connections > 0) Icons.Default.CastConnected else Icons.Default.Wifi,
                                contentDescription = null,
                                tint = if (connections > 0) Color(0xFF96E8D4) else Color(0xFFBBD7F6),
                                modifier = Modifier.size(18.dp)
                            )
                            Text(if (connections > 0) "$connections connected" else "Ready to connect",
                                style = MaterialTheme.typography.labelLarge,
                                color = MaterialTheme.colorScheme.onSurface)
                        }
                    }
                }
            }
        }
        '''
        replace_once(main, needle, '\n' + header + needle)

        # Overview refresh: a branded, at-a-glance card; existing preview/actions remain functionally identical.
        replace_once(main, '''    Column(modifier = Modifier.fillMaxSize()) {
                // content area''', '''    Column(modifier = Modifier.fillMaxSize().padding(horizontal = 10.dp, vertical = 4.dp)) {
                MustafaWelcomeBanner(serverName = serverName, active = state == ServerState.RUNNING,
                    connections = connections)
                // content area''')
        replace_once(main,
            '''                .clip(RoundedCornerShape(16.dp))
                        .background(MaterialTheme.colorScheme.surfaceVariant),
                    contentAlignment = Alignment.Center
                ) {
                    val connecting = state == ServerState.RUNNING''',
            '''                .clip(RoundedCornerShape(24.dp))
                        .background(Brush.linearGradient(listOf(Color(0xFF253954), Color(0xFF17213A)))),
                    contentAlignment = Alignment.Center
                ) {
                    val connecting = state == ServerState.RUNNING''')
        replace_once(main,
            '''            shape = RoundedCornerShape(16.dp)
                ) {
                    Column(modifier = Modifier.padding(20.dp)) {''',
            '''            shape = RoundedCornerShape(22.dp),
                    colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface),
                    border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant)
                ) {
                    Column(modifier = Modifier.padding(20.dp)) {''')

        welcome = '''
        @Composable
        private fun MustafaWelcomeBanner(serverName: String, active: Boolean, connections: Int) {
            Surface(
                modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 6.dp),
                color = MaterialTheme.colorScheme.surface,
                shape = RoundedCornerShape(20.dp),
                border = BorderStroke(1.dp, MaterialTheme.colorScheme.outlineVariant)
            ) {
                Row(
                    modifier = Modifier.fillMaxWidth().padding(horizontal = 18.dp, vertical = 12.dp),
                    verticalAlignment = Alignment.CenterVertically
                ) {
                    Icon(Icons.Default.Tv, null, tint = MaterialTheme.colorScheme.primary,
                        modifier = Modifier.size(30.dp))
                    Spacer(Modifier.width(14.dp))
                    Column {
                        Text("Your casting space", style = MaterialTheme.typography.titleMedium.copy(fontWeight = FontWeight.SemiBold))
                        Text(serverName, color = MaterialTheme.colorScheme.onSurfaceVariant,
                            style = MaterialTheme.typography.bodySmall)
                    }
                    Spacer(Modifier.weight(1f))
