        Intentionally does not modify AirPlay, rendering or decoder implementation.
        """
        from pathlib import Path

        BASE = Path('app/src/main')
        UI = BASE / 'kotlin/io/github/jqssun/airplay/ui'


        def replace_once(path, old, new):
            p = Path(path)
            t = p.read_text(encoding='utf-8')
            if t.count(old) != 1:
                raise SystemExit('FAIL: {}: anchor occurred {} times (expected 1): {}'.format(path, t.count(old), repr(old[:110])))
            p.write_text(t.replace(old, new, 1), encoding='utf-8')


        # Preserve applicationId (so settings and device pairing remain intact), just rebrand launcher identity.
        strings = BASE / 'res/values/strings.xml'
        replace_once(strings, '<string name="app_name">AirPlay Server</string>', '<string name="app_name">Mustafa</string>')
        replace_once(strings, '<string name="notification_title">AirPlay Server Running</string>', '<string name="notification_title">Mustafa is running</string>')

        # Stable TV-focused colors, not dynamic wallpaper-dependent colors.
        theme = UI / 'theme/Theme.kt'
        theme_text = '''package io.github.jqssun.airplay.ui.theme

        import androidx.compose.material3.MaterialTheme
        import androidx.compose.material3.darkColorScheme
        import androidx.compose.runtime.Composable
