      run: |
        python3 - <<'PY'
        #!/usr/bin/env python3
        """Major safe architectural change to Mustafa from Build9 stable.
        Move blocking MediaCodec work off native AirPlay RTP threads WITHOUT dropping any encoded H264 frame.
        """
        from pathlib import Path
        ROOT=Path('app/src/main/kotlin/io/github/jqssun/airplay')
        
        def replace_one(rel,old,new):
            p=ROOT/rel
            text=p.read_text('utf8')
            n=text.count(old)
            if n!=1: raise RuntimeError(f'Build10 patch failed {p}: anchor count {n} not 1: {old[:100]!r}')
            p.write_text(text.replace(old,new,1),'utf8')
        
        pump=ROOT/'renderer/VideoPacketPump.kt'
        if pump.exists(): raise RuntimeError('VideoPacketPump.kt already exists - expected clean base')
        pump.write_text('''package io.github.jqssun.airplay.renderer
        
        import android.os.Process
        import android.os.SystemClock
        import android.util.Log
        import java.util.concurrent.ArrayBlockingQueue
        import java.util.concurrent.TimeUnit
        
        /**
         * AirPlay RTP callback -> ordered, dedicated MediaCodec feeder.
         *
         * Crucial difference from the old Build8 dispatcher:
         * - NEVER discard an arbitrary H.264 P-frame, SPS, PPS or an entire GOP.
         * - Backpressure (rare) is applied only once all slots are in use.
         * - The output renderer's existing latest-DECODED-frame policy remains intact.
         * - There is exactly one MediaCodec feeder, so frame order stays correct.
         *
         * Not a claim of zero latency: when the hardware decoder is persistently slower
         * than the sender, preserving quality means backpressure cannot be eliminated.
         */
        class VideoPacketPump(private val renderer: VideoRenderer) {
            private data class Packet(
                val data: ByteArray,
                val ptsNs: Long,
                val h265: Boolean,
                val receivedNs: Long
            )
        
            // 6 encoded pictures ~= 200 ms at 30fps; keeps peak memory bounded.
            // No lossy overflow policy. This queue is intentionally smaller than Build8's.
            private val fifo = ArrayBlockingQueue<Packet>(6)
            @Volatile private var running = true
            private val statsLock = Any()
            @Volatile var queueWaitMs: Long = 0; private set
            @Volatile var receivedFps: Int = 0; private set
            @Volatile var backpressureCount: Long = 0; private set
            @Volatile var fedFps: Int = 0; private set
            val queueDepth: Int get() = fifo.size
            private var receivedInWindow = 0
            private var fedInWindow = 0
            private var lastTickMs = SystemClock.elapsedRealtime()
        
            private fun tick(now: Long) = synchronized(statsLock) {
                if (now - lastTickMs >= 1000) {
                    receivedFps = receivedInWindow
                    fedFps = fedInWindow
                    receivedInWindow = 0
                    fedInWindow = 0
                    lastTickMs = now
                    if (queueWaitMs > 80L || fifo.size >= 4 || backpressureCount > 0L) {
                        Log.i("MustafaLatency", "rx=$receivedFps fed=$fedFps " +
                            "queue=${fifo.size} queueWaitMs=$queueWaitMs " +
                            "backpressure=$backpressureCount outputDropped=${renderer.droppedFrames}")
                    }
                }
            }
        
            // Runs independently from the native RAOP packet receiver thread.
            private val feeder = Thread({
                Process.setThreadPriority(Process.THREAD_PRIORITY_DISPLAY)
                while (running) {
                    try {
                        val packet = fifo.poll(100, TimeUnit.MILLISECONDS) ?: continue
                        val wait = ((SystemClock.elapsedRealtimeNanos() - packet.receivedNs) / 1_000_000L)
                            .coerceAtLeast(0L)
                        queueWaitMs = (queueWaitMs * 3L + wait) / 4L
                        // MediaCodec may block. This thread, NOT the network callback, absorbs it.
                        renderer.feedFrame(packet.data, packet.ptsNs, packet.h265)
                        synchronized(statsLock) { fedInWindow++ }
                    } catch (_: InterruptedException) {
                        if (!running) return@Thread
                    } catch (e: Exception) {
                        Log.e("MustafaLatency", "Receiver worker recovered", e)
                    }
                }
            }, "MustafaVideoFeeder").also { it.isDaemon = true; it.start() }
        
            /** Preserve every encoded packet; backpressure only if the decoder can't catch up. */
            fun receive(data: ByteArray, ptsNs: Long, h265: Boolean) {
                if (!running) return
                val packet = Packet(data, ptsNs, h265, SystemClock.elapsedRealtimeNanos())
                synchronized(statsLock) { receivedInWindow++ }
                tick(SystemClock.elapsedRealtime())
                if (fifo.offer(packet)) return
                synchronized(statsLock) { backpressureCount++ }
                // Unlike Build8, never clear the GOP and never wait for a rare keyframe.
                while (running) {
                    try {
                        if (fifo.offer(packet, 40, TimeUnit.MILLISECONDS)) return
                    } catch (_: InterruptedException) {
                        Thread.currentThread().interrupt()
                        return
                    }
                }
            }
        
            /** Called only after the native RAOP server has stopped delivering packets. */
            fun close() {
                running = false
                fifo.clear()
                feeder.interrupt()
                if (Thread.currentThread() !== feeder) {
                    try { feeder.join(1500L) } catch (_: InterruptedException) {
                        Thread.currentThread().interrupt()
                    }
                }
                fifo.clear()
            }
        }
        ''','utf8')
        
