      - name: Fetch pinned GPL source and apply V3 branding + stretch
        run: python3 tools/prepare_source.py --output openscreen-src
      - name: Build APK
        run: |
          cd openscreen-src
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace
      - name: Verify APK identity, TV launcher and native ABIs
        run: |
          set -euo pipefail
          APK=openscreen-src/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='org.openscreen.tv'" /tmp/badging.txt
          grep -q "leanback-launchable-activity:" /tmp/badging.txt
          python3 - <<'PYCODE'
          import zipfile
          apk = 'openscreen-src/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              libs = [n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert libs, 'APK has no native libraries: AirPlay engine likely missing'
              assert any(n.startswith('lib/arm64-v8a/') or n.startswith('lib/armeabi-v7a/') for n in libs), 'Missing ARM native libraries'
              print('Native libraries:', len(libs))
          PYCODE
      - name: Package APK and GPL corresponding source
        run: |
          set -euo pipefail
          mkdir -p output
          cp openscreen-src/app/build/outputs/apk/debug/app-debug.apk output/OpenScreenTV-debug.apk
          tar -czf output/OpenScreenTV-corresponding-source.tar.gz \
            --exclude='.git' --exclude='.gradle' --exclude='build' \
            --exclude='.cxx' --exclude='output' openscreen-src
          (cd output && sha256sum OpenScreenTV-debug.apk OpenScreenTV-corresponding-source.tar.gz > SHA256SUMS.txt)
          ls -lh output/
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenScreenTV-Android14-APK-and-Source
          path: output/
          if-no-files-found: error
          retention-days: 30
