name: OpenScreen TV V3 - SDK Repaired Build APK
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4
      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages using absolute sdkmanager path
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm /111 | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found in ANDROID_HOME" >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Materialize OpenScreen TV V3 build kit
        run: |
          set -euo pipefail
          mkdir -p tools branding
          cat > tools/prepare_source.py <<'PY_PREPARE'
          #!/usr/bin/env python3
          """Prepare a GPLv3 AirPlay receiver fork for Android TV builds.
          
          Clones a pinned public upstream source and applies our independent package/branding.
          No code or assets from the proprietary AirScreen APK are copied.
          """
          from pathlib import Path
          import argparse
          import re
          import shutil
          import subprocess
          import sys
          
          UPSTREAM = 'https://github.com/jqssun/android-airplay-server.git'
          REVISION = 'a46cca0a6a1274e9e33c0e750f0f1c1eb1d881ea'
          PACKAGE = 'org.openscreen.tv'
          
          
          def run(*args, cwd=None):
              print('+', ' '.join(str(a) for a in args), flush=True)
              subprocess.run([str(a) for a in args], cwd=cwd, check=True)
          
          
          def replace_once(path: Path, old: str, new: str):
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected exactly one occurrence of {old!r} in {path}, got {text.count(old)}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          
          
          def prepare(repo: Path, assets: Path):
              gradle = repo/'app/build.gradle.kts'
              replace_once(gradle, 'applicationId = "io.github.jqssun.airplay"', f'applicationId = "{PACKAGE}"')
              # Keep namespace and Kotlin package paths untouched to avoid breaking upstream JNI/Hilt wiring.
              prefs = repo/'app/src/main/kotlin/io/github/jqssun/airplay/Prefs.kt'
              replace_once(prefs, 'str("server_name", "Android AirPlay", restart = true)', 'str("server_name", "OpenScreen TV", restart = true)')
              strings = repo/'app/src/main/res/values/strings.xml'
              replace_once(strings, '<string name="app_name">AirPlay Server</string>', '<string name="app_name">OpenScreen TV</string>')
              replace_once(strings, '<string name="notification_title">AirPlay Server Running</string>', '<string name="notification_title">OpenScreen TV Running</string>')
              replace_once(strings, '<string name="notification_channel">AirPlay Service</string>', '<string name="notification_channel">OpenScreen TV Service</string>')
              manifest = repo/'app/src/main/AndroidManifest.xml'
              replace_once(manifest, 'android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/openscreen_icon"')
              replace_once(manifest, 'android:roundIcon="@mipmap/ic_launcher_round"', 'android:roundIcon="@drawable/openscreen_icon"')
              replace_once(manifest, 'android:banner="@drawable/banner"', 'android:banner="@drawable/openscreen_banner"')
              drawable = repo/'app/src/main/res/drawable-nodpi'
              drawable.mkdir(parents=True, exist_ok=True)
              for file in ('openscreen_icon.png','openscreen_banner.png'):
                  shutil.copy2(assets/file, drawable/file)
              # Existing strings in other locale directories may still display upstream's translated title;
              # app_name is explicitly replaced wherever it occurs to avoid inconsistent launcher labels.
              for path in (repo/'app/src/main/res').glob('values-*/strings.xml'):
                  text=path.read_text(encoding='utf-8')
                  text, count=re.subn(r'(<string\s+name="app_name"[^>]*>).*?(</string>)',r'\g<1>OpenScreen TV\2',text,count=1,flags=re.S)
                  if count:
                      path.write_text(text,encoding='utf-8')
              # Stretch mirroring by sizing the SurfaceView to the entire TV viewport.
              # Android's EGL VideoPipeline renders the full texture into the surface; no crop.
              replace_once(prefs,
                  '    val AUTO_FULLSCREEN = bool("auto_fullscreen", true)',
                  '    val AUTO_FULLSCREEN = bool("auto_fullscreen", true)\n'
                  '    val STRETCH_MIRRORING = bool("stretch_mirroring", true)\n'
                  '    val STRETCH_VIDEO = bool("stretch_video", true)')
              main = repo/'app/src/main/kotlin/io/github/jqssun/airplay/ui/MainScreen.kt'
              replace_once(main,
                  '    val autoFullscreen by viewModel.pref(Prefs.AUTO_FULLSCREEN).collectAsState()\n',
                  '    val autoFullscreen by viewModel.pref(Prefs.AUTO_FULLSCREEN).collectAsState()\n'
                  '    val stretchMirroring by viewModel.pref(Prefs.STRETCH_MIRRORING).collectAsState()\n')
              replace_once(main,
                  '            aspectRatio = aspect\n        )\n',
                  '            aspectRatio = aspect,\n'
                  '            applyAspectRatio = !(fullscreen && stretchMirroring),\n'
                  '            modifier = if (fullscreen && stretchMirroring) Modifier.fillMaxSize() else Modifier\n        )\n')
              replace_once(main,
                  '        val zoomState = remember(viewModel) { ZoomState(viewModel, gestureScope) }',
                  '        val stretchVideo by viewModel.pref(Prefs.STRETCH_VIDEO).collectAsState()\n'
                  '        val zoomState = remember(viewModel, stretchVideo) {\n'
                  '            ZoomState(viewModel, gestureScope, if (stretchVideo) VideoContentScale.STRETCH else VideoContentScale.BEST_FIT)\n'
                  '        }')
              gesture = repo/'app/src/main/kotlin/io/github/jqssun/airplay/ui/gestures/GestureStates.kt'
              replace_once(gesture,
                  '    private val scope: CoroutineScope,\n) {\n    var zoom by mutableFloatStateOf(1f)',
                  '    private val scope: CoroutineScope,\n    private val defaultContentScale: VideoContentScale = VideoContentScale.BEST_FIT,\n) {\n    var zoom by mutableFloatStateOf(1f)')
              replace_once(gesture,
                  '    var contentScale by mutableStateOf(VideoContentScale.BEST_FIT)',
                  '    var contentScale by mutableStateOf(defaultContentScale)')
              replace_once(gesture,
                  '        contentScale = VideoContentScale.BEST_FIT',
                  '        contentScale = defaultContentScale')
              settings = repo/'app/src/main/kotlin/io/github/jqssun/airplay/ui/SettingsScreen.kt'
              replace_once(settings,
                  '    val autoFullscreen by viewModel.pref(Prefs.AUTO_FULLSCREEN).collectAsState()\n',
                  '    val autoFullscreen by viewModel.pref(Prefs.AUTO_FULLSCREEN).collectAsState()\n'
                  '    val stretchMirroring by viewModel.pref(Prefs.STRETCH_MIRRORING).collectAsState()\n'
                  '    val stretchVideo by viewModel.pref(Prefs.STRETCH_VIDEO).collectAsState()\n')
              replace_once(settings,
                  '        SettingResolution(\n',
                  '        SettingSwitch(\n'
                  '            title = stringResource(R.string.setting_stretch_mirroring),\n'
                  '            description = stringResource(R.string.setting_stretch_mirroring_desc),\n'
                  '            checked = stretchMirroring,\n'
                  '            onCheckedChange = { viewModel.set(Prefs.STRETCH_MIRRORING, it) }\n'
                  '        )\n\n'
                  '        SettingSwitch(\n'
                  '            title = stringResource(R.string.setting_stretch_video),\n'
                  '            description = stringResource(R.string.setting_stretch_video_desc),\n'
                  '            checked = stretchVideo,\n'
                  '            onCheckedChange = { viewModel.set(Prefs.STRETCH_VIDEO, it) }\n'
                  '        )\n\n'
                  '        SettingResolution(\n')
              replace_once(strings,
                  '    <!-- Settings: Display -->',
                  '    <!-- Settings: Display -->\n'
                  '    <string name="setting_stretch_mirroring">Full screen stretch (mirroring)</string>\n'
                  '    <string name="setting_stretch_mirroring_desc">Fill the TV screen with no crop or letterbox; may distort aspect ratio</string>\n'
                  '    <string name="setting_stretch_video">Full screen stretch (video)</string>\n'
                  '    <string name="setting_stretch_video_desc">Default to stretch during AirPlay video playback; can be changed with player controls</string>')
              # Add Arabic labels while retaining upstream translations for other UI strings.
              ar = repo/'app/src/main/res/values-ar'
              ar.mkdir(parents=True, exist_ok=True)
              ar_strings = ar/'strings.xml'
              if ar_strings.exists():
                  txt=ar_strings.read_text(encoding='utf-8')
                  if '</resources>' not in txt: raise RuntimeError('Unexpected Arabic strings.xml')
                  addition='    <string name="setting_stretch_mirroring">ملء الشاشة بالتمدد (نسخ الشاشة)</string>\n    <string name="setting_stretch_mirroring_desc">يملأ شاشة التلفزيون بلا قص أو حواف سوداء، وقد يغيّر تناسب الصورة</string>\n    <string name="setting_stretch_video">ملء الشاشة بالتمدد (الفيديو)</string>\n    <string name="setting_stretch_video_desc">التمدد افتراضياً عند تشغيل الفيديو، ويمكن تغييره من أدوات المشغل</string>\n'
                  ar_strings.write_text(txt.replace('</resources>', addition+'</resources>'),encoding='utf-8')
              else:
                  ar_strings.write_text('<resources>\n' + '    <string name="setting_stretch_mirroring">ملء الشاشة بالتمدد (نسخ الشاشة)</string>\n    <string name="setting_stretch_mirroring_desc">يملأ شاشة التلفزيون بلا قص أو حواف سوداء، وقد يغيّر تناسب الصورة</string>\n    <string name="setting_stretch_video">ملء الشاشة بالتمدد (الفيديو)</string>\n    <string name="setting_stretch_video_desc">التمدد افتراضياً عند تشغيل الفيديو، ويمكن تغييره من أدوات المشغل</string>\n' + '</resources>\n', encoding='utf-8')
              # A consistent high-contrast TV-first palette; avoids device-dependent dynamic colors.
              theme = repo/'app/src/main/kotlin/io/github/jqssun/airplay/ui/theme/Theme.kt'
              theme.write_text('''package io.github.jqssun.airplay.ui.theme
          
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          
          private val OpenScreenColors = darkColorScheme(
              primary = Color(0xFF9DDCFF),
              onPrimary = Color(0xFF09233B),
              secondary = Color(0xFFD4B6FF),
              onSecondary = Color(0xFF2A1943),
              tertiary = Color(0xFF9BE9D7),
              background = Color(0xFF0B1220),
              onBackground = Color(0xFFF4F7FF),
              surface = Color(0xFF172237),
              onSurface = Color(0xFFF4F7FF),
              surfaceVariant = Color(0xFF24344F),
              onSurfaceVariant = Color(0xFFD6E2F5),
              outline = Color(0xFF7C90B0),
              error = Color(0xFFFFB5BF)
          )
          
          @Composable
          fun AirPlayTheme(
              darkTheme: Boolean = true,
              content: @Composable () -> Unit
          ) {
              MaterialTheme(colorScheme = OpenScreenColors, content = content)
          }
          ''', encoding='utf-8')
              # Keep existing upstream code and GPL notices intact; add derivative notice.
              (repo/'OPENSCREEN_DERIVATIVE_NOTICE.txt').write_text(
                  'OpenScreen TV is an independent GPL-3.0 derivative of jqssun/android-airplay-server.\n'
                  f'Upstream source: {UPSTREAM}\nUpstream revision: {REVISION}\n'
                  'Modifications: app ID, branding, dark TV theme, default stretch modes, and two display settings.\n'
                  'No proprietary AirScreen code or assets were used.\n'
                  'Source code of the complete derivative is available in this build checkout.\n', encoding='utf-8')
              print(f'Prepared OpenScreen TV at {repo}')
          
          
          def main():
              parser=argparse.ArgumentParser()
              parser.add_argument('--source',type=Path,help='Use an existing checkout (for offline testing)')
              parser.add_argument('--output',type=Path,default=Path('openscreen-src'))
              args=parser.parse_args()
              root=Path(__file__).resolve().parent.parent
              target=args.source.resolve() if args.source else args.output.resolve()
              if not args.source:
                  if target.exists():
                      raise SystemExit(f'Refusing to overwrite existing folder: {target}')
                  run('git','clone','--recursive',UPSTREAM,target)
                  run('git','checkout',REVISION,cwd=target)
                  actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=target, text=True).strip()
                  if actual != REVISION:
                      raise RuntimeError(f'Unexpected upstream revision: {actual}')
                  run('git','submodule','update','--init','--recursive',cwd=target)
              prepare(target,root/'branding')
          
          if __name__=='__main__':
              main()
          PY_PREPARE
          base64 -d > branding/openscreen_icon.png <<'B64_OPENSCREEN_ICON_PNG'
